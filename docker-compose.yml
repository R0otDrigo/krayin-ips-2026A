services:
  app:
    image: ghcr.io/r0otdrigo/krayips-2026a:latest
    ports:
      - "80:80"
    depends_on:
      - mysql
      - redis
    environment:
      DB_HOST: mysql
      DB_DATABASE: krayin
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: krayin
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:6.2-alpine

volumes:
  mysql_data:
